<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — LastFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header id="site-header" class="solid-static">
    <div class="hdr-inner">
      <a href="index.html" class="hdr-word">LASTFIT<span class="accent-dot">.</span></a>
      <div class="hdr-actions">
        <a href="inscription.html" class="hdr-login uplabel">Créer un compte</a>
      </div>
    </div>
  </header>

  <main class="page page-narrow">
    <span class="uplabel muted">Espace sportif</span>
    <h1 class="page-title" style="margin-bottom:24px">Connexion</h1>

    <div class="form-card">
      <div id="form-alert"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="vous@email.fr" required />
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Se connecter</button>
      </form>
      <p class="muted" style="font-size:13px;margin-top:20px;text-align:center">
        Pas encore de compte ? <a href="inscription.html" style="color:var(--ink);font-weight:600">Inscrivez-vous</a>
      </p>
    </div>

    <div class="alert alert-info" style="margin-top:20px">
      <b>Compte de démo :</b> lea@demo.fr · mot de passe <b>demo1234</b>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
